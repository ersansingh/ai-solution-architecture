name: MLOps & LLMOps Enterprise Delivery Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: saas-ai-platform/vllm-copilot
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # =========================================================================
  # 1. CONTINUOUS INTEGRATION & SECURITY SCANNING
  # =========================================================================
  ci-code-security:
    name: Lint, Test & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install ruff pytest snyk bandit

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Unit Tests
        run: |
          pytest tests/unit -v --junitxml=test-results.xml

      - name: Run Security & Secret Scanning (Gitleaks & Bandit)
        run: |
          bandit -r src/ -ll

  # =========================================================================
  # 2. PROMPT & MODEL EVALUATION BENCHMARK
  # =========================================================================
  llm-evaluation-benchmark:
    name: Automated Prompt & RAG Quality Benchmark
    needs: ci-code-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Ragas & TruLens Evaluation Suite
        env:
          BEDROCK_ASSUME_ROLE: ${{ secrets.AWS_BEDROCK_EVAL_ROLE }}
        run: |
          python -m eval.run_ragas_benchmarks \
            --golden-dataset data/eval/copilot_golden_v2.json \
            --min-faithfulness 0.88 \
            --min-context-recall 0.90 \
            --min-answer-relevance 0.92

  # =========================================================================
  # 3. CONTAINER BUILD & REGIONAL ECR REPLICATION
  # =========================================================================
  build-and-publish-container:
    name: Build & Replicate Container to 5 Regions
    needs: llm-evaluation-benchmark
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Container
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

  # =========================================================================
  # 4. GITOPS PROGRESSIVE DEPLOYMENT (ARGOCD & FLAGGER CANARY)
  # =========================================================================
  gitops-canary-deploy:
    name: ArgoCD Progressive Canary Deployment (5 Regions)
    needs: build-and-publish-container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Manifest Repository
        uses: actions/checkout@v4
        with:
          repository: enterprise-saas/gitops-k8s-manifests
          token: ${{ secrets.GITOPS_DEPLOY_PAT }}

      - name: Update Image Tag in Helm Values
        run: |
          sed -i 's|tag:.*|tag: "${{ env.IMAGE_TAG }}"|g' environments/prod/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): promote image ${{ env.IMAGE_TAG }} to production across 5 regional EKS hubs"
          git push origin main
