# Workload identity for KServe pods. Federated in terraform
# (azurerm_federated_identity_credential.serving, subject
# system:serviceaccount:churn-serving:churn-kserve-sa).
# Render: SERVING_IDENTITY_CLIENT_ID=$(terraform output -raw serving_workload_identity_client_id)
#         envsubst < serving/k8s/serviceaccount.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: churn-kserve-sa
  namespace: churn-serving
  annotations:
    azure.workload.identity/client-id: "${SERVING_IDENTITY_CLIENT_ID}"
automountServiceAccountToken: true
