# Champion InferenceService (KServe Serverless mode on private AKS).
# Transformer (Feast lookup, calibration, TreeSHAP) -> Predictor (MLServer LightGBM, V2).
#
# Managed by Argo CD after bootstrap. Argo CD must ignore drift on
# spec.{predictor,transformer}.canaryTrafficPercent, spec.predictor.model.storageUri,
# spec.transformer.containers[0].image/env[0] and the churn.ai/model-version
# annotation, which deploy-canary patches during progressive rollout.
#
# Bootstrap (same variables as the pipeline's envsubst calls):
#   export ISVC_NAME=churn-lgbm KSERVE_NAMESPACE=churn-serving ACR_LOGIN=<acr>.azurecr.io \
#          IMAGE_NAME=churn/kserve-transformer IMAGE_TAG=<sha> MODEL_VERSION=<n> \
#          STORAGE_URI=https://<lake>.blob.core.windows.net/models/churn-lightgbm/<n>/artifacts
#   envsubst < serving/k8s/inferenceservice.yaml | kubectl apply -f -
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ${ISVC_NAME}
  namespace: ${KSERVE_NAMESPACE}
  labels:
    app: churn-scoring
    churn.ai/role: champion
  annotations:
    churn.ai/model-version: "${MODEL_VERSION}"
    serving.kserve.io/deploymentMode: Serverless
    # Service-side p99 SLOs: precomputed < 50 ms, rescoring < 150 ms
    serving.knative.dev/progress-deadline: "600s"
spec:
  predictor:
    serviceAccountName: churn-kserve-sa
    minReplicas: 3
    maxReplicas: 8
    scaleMetric: concurrency
    scaleTarget: 20
    timeout: 1
    labels:
      azure.workload.identity/use: "true"
    nodeSelector:
      kubernetes.azure.com/mode: user
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            serving.kserve.io/inferenceservice: ${ISVC_NAME}
            component: predictor
    model:
      modelFormat:
        name: lightgbm
      runtime: kserve-mlserver
      protocolVersion: v2
      # https://<lake>.blob.core.windows.net/models/<model>/<version>/artifacts
      # (model.bst + calibrator.json), exported by register-model
      # (churn.deploy.export_model); the storage initializer authenticates with
      # workload identity (AZURE_CLIENT_ID injected via azure.workload.identity/use).
      storageUri: ${STORAGE_URI}
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      readinessProbe:
        httpGet:
          path: /v2/health/ready
        periodSeconds: 5
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
  transformer:
    serviceAccountName: churn-kserve-sa
    minReplicas: 3
    maxReplicas: 12
    scaleMetric: rps
    scaleTarget: 800
    timeout: 1
    labels:
      azure.workload.identity/use: "true"
    nodeSelector:
      kubernetes.azure.com/mode: user
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            serving.kserve.io/inferenceservice: ${ISVC_NAME}
            component: transformer
    containers:
      - name: kserve-container
        image: ${ACR_LOGIN}/${IMAGE_NAME}:${IMAGE_TAG}
        env:
          # env[0] is patched by deploy-canary together with the predictor storageUri
          - name: STORAGE_URI
            value: ${STORAGE_URI}
          - name: CHURN_ISVC
            value: ${ISVC_NAME}
          - name: SHADOW_MODE
            value: "false"
          - name: HOP_TIMEOUT_S
            value: "0.3"
          - name: LAKE_STORAGE_ACCOUNT
            valueFrom:
              configMapKeyRef:
                name: churn-serving-config
                key: lake_storage_account
          - name: REDIS_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                # synced from Key Vault secret redis-connection-string by the Secrets
                # Store CSI driver (secretproviderclass-redis.yaml, churn-secrets-sync)
                name: churn-redis
                key: connection-string
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "2"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /v2/health/ready
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /v2/health/live
          periodSeconds: 10
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop: ["ALL"]
