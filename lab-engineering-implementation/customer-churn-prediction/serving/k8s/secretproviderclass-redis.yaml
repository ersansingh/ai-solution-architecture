# Redis (Feast online store) connection secret: Key Vault -> Kubernetes Secret
# `churn-redis` (key `connection-string`) via the Secrets Store CSI Driver
# (AKS add-on azure-keyvault-secrets-provider, enabled with 5 min rotation in
# terraform) using the serving workload identity (churn-kserve-sa ->
# id-serving, which has "Key Vault Secrets User" on the vault).
#
# Key Vault secret (must exist; terraform does NOT create it, see pipelines/README.md):
#   name : redis-connection-string
#   value: <redis-hostname>:6380,ssl=true,password=<access key>
#          (Feast redis connection_string format; Premium with shards is a
#          cluster, so features/feature_store.yaml uses redis_type: redis_cluster)
#
# Why a sync Deployment instead of mounting the CSI volume in the
# InferenceService: the CSI driver only creates/updates the synced Secret while
# a pod mounts the volume, and Knative Serving (KServe Serverless mode) only
# admits a restricted set of volume types in revision pod specs (CSI is not
# among the defaults). This tiny pause pod keeps `churn-redis`
# present and rotated; the transformer reads it with secretKeyRef. Env vars are
# read at container start, so a rotated value reaches transformers on their
# next rollout (any new revision / pod restart).
#
# Render (deploy-shadow applies this idempotently):
#   SERVING_IDENTITY_CLIENT_ID=$(terraform output -raw serving_workload_identity_client_id)
#   KEY_VAULT_NAME=<kv-...> AZURE_TENANT_ID=<tenant>
#   envsubst < serving/k8s/secretproviderclass-redis.yaml | kubectl apply -f -
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: churn-redis-kv
  namespace: churn-serving
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${SERVING_IDENTITY_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${AZURE_TENANT_ID}"
    objects: |
      array:
        - |
          objectName: redis-connection-string
          objectType: secret
  secretObjects:
    - secretName: churn-redis
      type: Opaque
      labels:
        app.kubernetes.io/part-of: churn-platform
      data:
        - objectName: redis-connection-string
          key: connection-string
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-secrets-sync
  namespace: churn-serving
  labels:
    app: churn-secrets-sync
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-secrets-sync
  template:
    metadata:
      labels:
        app: churn-secrets-sync
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: churn-kserve-sa
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.azure.com/mode: user
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          image: mcr.microsoft.com/oss/kubernetes/pause:3.9
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: churn-redis-kv
