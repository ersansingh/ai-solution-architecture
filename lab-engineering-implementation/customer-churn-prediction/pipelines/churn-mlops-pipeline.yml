# =========================================================================
# CUSTOMER CHURN PREDICTION - MLOps CI / CT / CD PIPELINE (GitHub Actions)
#
#   CI  : lint, unit tests, Great Expectations data contracts, leakage tests,
#         container build + Trivy scan
#   IaC : Terraform plan (PR) / apply (main, approval) via OIDC to Azure
#   CT  : Azure ML training pipeline (LightGBM champion vs CatBoost challenger)
#         -> evaluation gates (PR-AUC vs champion, calibration, fairness, latency)
#         -> register in MLflow (Azure ML registry)
#         -> export model artifacts to Blob Storage (KServe-loadable https URI)
#   CD  : KServe on private AKS: shadow (7-day soak) -> canary 10% -> 50% -> 100%
#         (canaryTrafficPercent), prod approval, automatic rollback
#
# Triggers: push/PR, weekly retrain cron (Sunday 02:00 UTC), manual dispatch,
#           and repository_dispatch "drift-detected" from the Evidently drift job.
# Required repository secrets / variables / environments: pipelines/README.md.
# Deploy/apply jobs run on self-hosted runners inside the spoke VNet because
# AKS, Key Vault and Azure ML are private-endpoint only.
# Copy to .github/workflows/ to activate. All `run:` steps execute from the
# project directory (defaults.run.working-directory); `uses:` steps that take
# paths are prefixed with APP_DIR. PYTHONPATH exposes src/ (churn package).
# =========================================================================
name: Churn MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "lab-engineering-implementation/customer-churn-prediction/**"
      - ".github/workflows/churn-mlops-pipeline.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0" # weekly retrain, Sunday 02:00 UTC (system-design.md 6.4, 11)
  workflow_dispatch:
    inputs:
      retrain_reason:
        description: "Reason for manual retrain"
        required: false
        default: "manual"
      skip_deploy:
        description: "Train and register only (no rollout)"
        type: boolean
        default: false
  repository_dispatch:
    types: [drift-detected, performance-degraded]

permissions:
  id-token: write # OIDC federation to Microsoft Entra ID
  contents: read
  pull-requests: write
  security-events: write

# No workflow-level concurrency: a run stays open for the 7-day shadow soak and
# would block every later push/PR run on the same ref. Serialisation is per job
# (terraform-apply, ct-train, deploy-shadow, deploy-canary).

defaults:
  run:
    working-directory: lab-engineering-implementation/customer-churn-prediction

env:
  APP_DIR: lab-engineering-implementation/customer-churn-prediction
  PYTHONPATH: ${{ github.workspace }}/lab-engineering-implementation/customer-churn-prediction/src
  PYTHON_VERSION: "3.11"
  AZURE_RESOURCE_GROUP: rg-churn-prod-westeurope
  AML_WORKSPACE: mlw-churn-prod
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: churn/kserve-transformer
  IMAGE_TAG: ${{ github.sha }}
  AKS_CLUSTER: aks-churn-prod
  KSERVE_NAMESPACE: churn-serving
  ISVC_NAME: churn-lgbm
  MODEL_NAME: churn-lightgbm
  TF_DIR: lab-engineering-implementation/customer-churn-prediction/terraform
  TF_VERSION: "1.9.8"
  # Lake (ADLS Gen2) account and Key Vault have random suffixes in terraform:
  # set from `terraform output -raw lake_storage_account_name` / the kv-* name.
  LAKE_STORAGE_ACCOUNT: ${{ vars.LAKE_STORAGE_ACCOUNT }}
  KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
  MODELS_CONTAINER: models # lake filesystem for KServe model artifacts
  REDIS_KV_SECRET: redis-connection-string # Feast online store connection (Key Vault)
  FEAST_VERSION: "0.40.1"
  SHADOW_SOAK_DAYS: "7" # system-design.md 6.4 step 7
  # Evaluation gate thresholds
  MIN_PR_AUC_UPLIFT: "0.005" # challenger must beat champion PR-AUC by >= 0.5pt
  MAX_ECE: "0.02" # expected calibration error (system-design.md 6.4 / 7.10)
  MIN_DISPARATE_IMPACT: "0.80" # four-fifths rule across protected segments
  MAX_EQUAL_OPP_DIFF: "0.05"
  MAX_P99_LATENCY_MS: "50" # precomputed path SLO (service-side)
  MAX_P99_RESCORE_MS: "150" # on-demand rescoring path SLO (service-side)
  MAX_P99_APIM_MS: "300" # end-to-end through APIM (p99 alert threshold, system-design.md 7)

jobs:
  # =========================================================================
  # 0. CHANGE DETECTION
  # =========================================================================
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'lab-engineering-implementation/customer-churn-prediction/terraform/**'
            ml:
              - 'lab-engineering-implementation/customer-churn-prediction/src/**'
              - 'lab-engineering-implementation/customer-churn-prediction/features/**'
              - 'lab-engineering-implementation/customer-churn-prediction/serving/**'
              - 'lab-engineering-implementation/customer-churn-prediction/pipelines/aml/**'
              - 'lab-engineering-implementation/customer-churn-prediction/data_contracts/**'

  # =========================================================================
  # 1. CONTINUOUS INTEGRATION: CODE QUALITY, DATA CONTRACTS, LEAKAGE
  # =========================================================================
  ci-quality:
    name: Lint, Unit Tests, Data Contracts & Leakage Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install ruff pytest pytest-cov great_expectations==1.* bandit

      - name: Ruff lint & format check
        run: |
          ruff check .
          ruff format --check .

      - name: Static security analysis (Bandit)
        run: bandit -r src/ -ll

      - name: Unit tests (feature transforms, Feast definitions, transformer)
        run: |
          pytest tests/unit -v --cov=src --cov-fail-under=80 \
            --junitxml=reports/unit-tests.xml

      - name: Great Expectations data contracts (schema, nulls, ranges, freshness)
        run: |
          # Validates sampled Silver/Gold fixtures against versioned contracts:
          # customer_id pseudonymized, tenure >= 0, monthly_charges > 0,
          # churn label only from post-snapshot window, row-count drift < 5%
          python -m churn.data_contracts.run \
            --suite data_contracts/gold_customer_features.json \
            --suite data_contracts/silver_billing.json \
            --data tests/fixtures/contract_samples \
            --fail-on-error

      - name: Target leakage & temporal integrity tests
        run: |
          # - no feature timestamp > snapshot_date (point-in-time joins)
          # - no post-churn signals (cancellation tickets, port-out requests)
          # - single-feature AUC < 0.95 sanity check
          # - train/validation/out-of-time split has no customer overlap
          pytest tests/leakage -v --junitxml=reports/leakage-tests.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: ${{ env.APP_DIR }}/reports/

  # =========================================================================
  # 2. CONTAINER BUILD + VULNERABILITY SCAN (KServe Transformer image)
  # =========================================================================
  build-and-scan:
    name: Build & Scan Serving Image
    runs-on: ubuntu-latest
    needs: ci-quality
    environment: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (Feast transformer + TreeSHAP explainer)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}/serving/
          file: ${{ env.APP_DIR }}/serving/Dockerfile
          # features/feature_store.yaml is the single Feast config (COPY --from=features)
          build-contexts: |
            features=${{ env.APP_DIR }}/features
          load: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Azure login (OIDC)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image to ACR
        if: github.event_name != 'pull_request'
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

  # =========================================================================
  # 3. INFRASTRUCTURE AS CODE: TERRAFORM PLAN / APPLY (OIDC)
  # =========================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: [self-hosted, linux, churn-vnet]
    needs: changes
    if: needs.changes.outputs.infra == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (remote state, Entra auth)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=churn-platform/prod.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Checkov IaC policy scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_DIR }}
          framework: terraform
          soft_fail: false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan -var-file=env/prod.tfvars

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan

  terraform-apply:
    name: Terraform Apply (approval)
    runs-on: [self-hosted, linux, churn-vnet]
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: infra-prod # required reviewers: platform + security
    concurrency:
      group: churn-terraform-apply
      cancel-in-progress: false
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=churn-platform/prod.tfstate"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

  # =========================================================================
  # 4. FEATURE STORE: FEAST APPLY (features/ -> shared registry on the lake)
  # =========================================================================
  feature-store-apply:
    name: Feast Apply (registry + training config)
    runs-on: [self-hosted, linux, churn-vnet]
    needs: [changes, ci-quality]
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.ml == 'true')
    concurrency:
      group: churn-feast-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Feast
        run: pip install "feast[azure,redis]==${FEAST_VERSION}"

      - name: Feast plan & apply
        run: |
          test -n "$LAKE_STORAGE_ACCOUNT" || { echo "::error::vars.LAKE_STORAGE_ACCOUNT is not set"; exit 1; }
          test -n "$KEY_VAULT_NAME" || { echo "::error::vars.KEY_VAULT_NAME is not set"; exit 1; }
          # Only needed if apply removes a feature view (Feast then deletes its Redis keys).
          REDIS_CONNECTION_STRING=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" \
            --name "$REDIS_KV_SECRET" --query value -o tsv)
          echo "::add-mask::$REDIS_CONNECTION_STRING"
          export REDIS_CONNECTION_STRING
          cd features
          # Sources are Parquet on the private lake; schemas are explicit in
          # definitions.py and validated by the data contracts in ci-quality.
          feast plan --skip-source-validation
          feast apply --skip-source-validation

      - name: Publish feature_store.yaml for Azure ML (feast_config input)
        run: |
          # Substitute only the lake account; Redis stays a placeholder (training
          # uses the offline store only and never connects to Redis).
          envsubst '$LAKE_STORAGE_ACCOUNT' < features/feature_store.yaml > "$RUNNER_TEMP/feature_store.yaml"
          az storage blob upload --auth-mode login \
            --account-name "$LAKE_STORAGE_ACCOUNT" --container-name feast-offline \
            --name repo/feature_store.yaml --file "$RUNNER_TEMP/feature_store.yaml" --overwrite

  # =========================================================================
  # 5. CONTINUOUS TRAINING: AZURE ML TRAINING PIPELINE
  # =========================================================================
  ct-train:
    name: Trigger Azure ML Training Pipeline
    runs-on: [self-hosted, linux, churn-vnet]
    needs: [changes, ci-quality, feature-store-apply]
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.ml == 'true')
    concurrency:
      group: churn-ct-train
      cancel-in-progress: false
    outputs:
      job_name: ${{ steps.submit.outputs.job_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML CLI v2
        run: az extension add --name ml --upgrade --yes

      - name: Ensure AML datastores (lake_gold, lake_feast_offline; identity-based)
        run: bash pipelines/aml/scripts/ensure-datastores.sh

      - name: Submit training pipeline
        id: submit
        env:
          TRIGGER_REASON: ${{ github.event.client_payload.reason || github.event.inputs.retrain_reason || github.event_name }}
          DRIFT_REPORT: ${{ github.event.client_payload.drift_report_uri || 'none' }}
        run: |
          # Pipeline steps: Feast point-in-time training set (18M x 24m history)
          # -> out-of-time split -> Optuna sweep on cpu-tuning-spot (LightGBM, CatBoost)
          # -> isotonic calibration -> TreeSHAP global importance -> evaluation report
          JOB_NAME=$(az ml job create \
            --file pipelines/aml/churn-training-pipeline.yml \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --workspace-name "$AML_WORKSPACE" \
            --set display_name="churn-retrain-${GITHUB_RUN_ID}" \
            --set tags.trigger="$TRIGGER_REASON" \
            --set tags.git_sha="$GITHUB_SHA" \
            --set tags.drift_report="$DRIFT_REPORT" \
            --set inputs.snapshot_date="$(date -u +%Y-%m-%d)" \
            --query name -o tsv)
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Stream job until completion
        run: |
          az ml job stream --name "${{ steps.submit.outputs.job_name }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AML_WORKSPACE"
          STATUS=$(az ml job show --name "${{ steps.submit.outputs.job_name }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AML_WORKSPACE" \
            --query status -o tsv)
          [ "$STATUS" = "Completed" ] || { echo "Training failed: $STATUS"; exit 1; }

  # =========================================================================
  # 6. EVALUATION GATES: PR-AUC vs CHAMPION, CALIBRATION, FAIRNESS, LATENCY
  # =========================================================================
  ct-evaluate:
    name: Evaluation Gates
    runs-on: [self-hosted, linux, churn-vnet]
    needs: ct-train
    outputs:
      candidate_run_id: ${{ steps.gates.outputs.run_id }}
      pr_auc: ${{ steps.gates.outputs.pr_auc }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install evaluation dependencies
        run: |
          az extension add --name ml --upgrade --yes
          pip install mlflow azureml-mlflow lightgbm catboost fairlearn scikit-learn shap

      - name: Download evaluation outputs
        run: |
          az ml job download --name "${{ needs.ct-train.outputs.job_name }}" \
            --output-name evaluation_report --download-path eval/ \
            --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AML_WORKSPACE"
          # az ml job download places named outputs under named-outputs/<name>/
          if [ -d eval/named-outputs/evaluation_report ]; then
            mv eval/named-outputs/evaluation_report eval/evaluation_report
          fi
          test -f eval/evaluation_report/metrics.json

      - name: Run gates
        id: gates
        run: |
          export MLFLOW_TRACKING_URI=$(az ml workspace show -n "$AML_WORKSPACE" \
            -g "$AZURE_RESOURCE_GROUP" --query mlflow_tracking_uri -o tsv)
          # Gate 1: out-of-time PR-AUC (and recall@top-decile) >= champion + MIN_PR_AUC_UPLIFT
          # Gate 2: calibration ECE <= MAX_ECE and Brier score not worse than champion
          # Gate 3: fairness (Fairlearn) across age band, gender, region:
          #         disparate impact >= MIN_DISPARATE_IMPACT, equal-opportunity diff <= MAX_EQUAL_OPP_DIFF
          # Gate 4: latency benchmark on Standard_F8s_v2-equivalent container:
          #         p99 precomputed <= MAX_P99_LATENCY_MS, p99 rescoring+SHAP <= MAX_P99_RESCORE_MS
          # Gate 5: SHAP sanity (no single feature > 40% of global importance)
          python -m churn.evaluation.gates \
            --report eval/evaluation_report \
            --champion-alias champion \
            --model-name "$MODEL_NAME" \
            --min-pr-auc-uplift "$MIN_PR_AUC_UPLIFT" \
            --max-ece "$MAX_ECE" \
            --min-disparate-impact "$MIN_DISPARATE_IMPACT" \
            --max-equal-opp-diff "$MAX_EQUAL_OPP_DIFF" \
            --max-p99-latency-ms "$MAX_P99_LATENCY_MS" \
            --max-p99-rescore-ms "$MAX_P99_RESCORE_MS" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish model card & gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-card-and-gates
          path: |
            ${{ env.APP_DIR }}/eval/evaluation_report/model_card.md
            ${{ env.APP_DIR }}/eval/evaluation_report/gates.json
            ${{ env.APP_DIR }}/eval/evaluation_report/fairness_report.html

  # =========================================================================
  # 7. REGISTER CANDIDATE IN MLFLOW MODEL REGISTRY (AZURE ML) + EXPORT FOR KSERVE
  #    KServe's storage initializer cannot load azureml:// or models:/ URIs, so
  #    the registered artifacts are copied to the lake `models` filesystem at
  #    models/<model>/<version>/artifacts and served from that https blob URI
  #    (workload identity, Storage Blob Data Reader for id-serving).
  # =========================================================================
  register-model:
    name: Register Model in MLflow & Export for KServe
    runs-on: [self-hosted, linux, churn-vnet]
    needs: ct-evaluate
    outputs:
      model_version: ${{ steps.register.outputs.model_version }}
      storage_uri: ${{ steps.export.outputs.storage_uri }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install registry dependencies
        run: |
          pip install -r serving/requirements-deploy.txt
          az extension add --name ml --upgrade --yes
          echo "MLFLOW_TRACKING_URI=$(az ml workspace show -n "$AML_WORKSPACE" \
            -g "$AZURE_RESOURCE_GROUP" --query mlflow_tracking_uri -o tsv)" >> "$GITHUB_ENV"

      - name: Register model version with lineage tags
        id: register
        run: |
          python - <<'PY'
          import os
          import mlflow
          from mlflow import MlflowClient

          run_id = "${{ needs.ct-evaluate.outputs.candidate_run_id }}"
          name = os.environ["MODEL_NAME"]
          mv = mlflow.register_model(f"runs:/{run_id}/model", name)
          client = MlflowClient()
          for k, v in {
              "git_sha": os.environ["GITHUB_SHA"],
              "pipeline_run": os.environ["GITHUB_RUN_ID"],
              "oot_pr_auc": "${{ needs.ct-evaluate.outputs.pr_auc }}",
              "gates": "passed",
          }.items():
              client.set_model_version_tag(name, mv.version, k, v)
          client.set_registered_model_alias(name, "challenger", mv.version)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"model_version={mv.version}\n")
          PY

      - name: Export model artifacts to Blob Storage (KServe storageUri)
        id: export
        run: |
          test -n "$LAKE_STORAGE_ACCOUNT" || { echo "::error::vars.LAKE_STORAGE_ACCOUNT is not set"; exit 1; }
          # Writes storage_uri=https://<lake>.blob.core.windows.net/models/<model>/<version>/artifacts
          python -m churn.deploy.export_model --model-name "$MODEL_NAME" \
            --model-version "${{ steps.register.outputs.model_version }}" \
            --account "$LAKE_STORAGE_ACCOUNT" --container "$MODELS_CONTAINER"

      - name: Tag model version with serving URI
        env:
          MODEL_VERSION: ${{ steps.register.outputs.model_version }}
          STORAGE_URI: ${{ steps.export.outputs.storage_uri }}
        run: |
          python - <<'PY'
          import os
          from mlflow import MlflowClient

          MlflowClient().set_model_version_tag(
              os.environ["MODEL_NAME"], os.environ["MODEL_VERSION"],
              "serving_storage_uri", os.environ["STORAGE_URI"],
          )
          PY

  # =========================================================================
  # 8. CD STAGE 1a: SHADOW DEPLOYMENT (mirrored traffic, no customer impact)
  #    Deploys the shadow + Istio mirror (APIM ingress and mesh traffic), runs a
  #    30-minute warm-up gate and LEAVES the shadow running for the soak.
  # =========================================================================
  deploy-shadow:
    name: Shadow Deployment (deploy + warm-up gate)
    runs-on: [self-hosted, linux, churn-vnet]
    needs: [register-model, build-and-scan]
    if: github.event.inputs.skip_deploy != 'true'
    environment: staging
    concurrency:
      group: churn-shadow-deploy
      cancel-in-progress: false
    env:
      STORAGE_URI: ${{ needs.register-model.outputs.storage_uri }}
      MODEL_VERSION: ${{ needs.register-model.outputs.model_version }}
      SERVING_IDENTITY_CLIENT_ID: ${{ vars.SERVING_IDENTITY_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ISTIO_INGRESS_GATEWAY: ${{ vars.ISTIO_INGRESS_GATEWAY }}
      CHURN_API_INGRESS_HOST: ${{ vars.CHURN_API_INGRESS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deploy dependencies
        run: pip install -r serving/requirements-deploy.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials (Entra ID, private API server)
        run: |
          az aks get-credentials -g "$AZURE_RESOURCE_GROUP" -n "$AKS_CLUSTER" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Sync Redis secret from Key Vault (Secrets Store CSI)
        run: |
          for v in SERVING_IDENTITY_CLIENT_ID KEY_VAULT_NAME AZURE_TENANT_ID; do
            test -n "${!v}" || { echo "::error::$v is not set (see pipelines/README.md)"; exit 1; }
          done
          envsubst < serving/k8s/secretproviderclass-redis.yaml | kubectl apply -f -
          kubectl rollout status deployment/churn-secrets-sync -n "$KSERVE_NAMESPACE" --timeout=300s
          # The CSI driver creates Secret churn-redis once the volume is mounted
          for i in $(seq 1 30); do
            kubectl get secret churn-redis -n "$KSERVE_NAMESPACE" >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::error::Secret churn-redis was not synced from Key Vault ($KEY_VAULT_NAME/$REDIS_KV_SECRET)"
          exit 1

      - name: Deploy shadow InferenceService + Istio mirror
        run: |
          for v in ISTIO_INGRESS_GATEWAY CHURN_API_INGRESS_HOST STORAGE_URI; do
            test -n "${!v}" || { echo "::error::$v is not set (see pipelines/README.md)"; exit 1; }
          done
          export ACR_LOGIN="$ACR_NAME.azurecr.io"
          export SHADOW_STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          current=$(kubectl get isvc "${ISVC_NAME}-shadow" -n "$KSERVE_NAMESPACE" \
            -o jsonpath='{.metadata.annotations.churn\.ai/model-version}' 2>/dev/null || true)
          if [ -n "$current" ] && [ "$current" != "$MODEL_VERSION" ]; then
            echo "::warning::Superseding shadow v$current (its soak run will fail as superseded)"
          fi
          envsubst < serving/k8s/inferenceservice-shadow.yaml | kubectl apply -f -
          envsubst < serving/k8s/virtualservice-mirror.yaml | kubectl apply -f -
          kubectl wait --for=condition=Ready "isvc/${ISVC_NAME}-shadow" \
            -n "$KSERVE_NAMESPACE" --timeout=600s

      - name: Shadow warm-up gate (30 min, fail fast)
        run: |
          # Catches broken candidates before the 7-day soak: rank correlation,
          # risk-tier agreement, p99 latency and 5xx rate on mirrored traffic.
          python -m churn.deploy.shadow_analysis \
            --prometheus-url "${{ vars.AMW_PROMETHEUS_QUERY_URL }}" \
            --namespace "$KSERVE_NAMESPACE" \
            --champion "$ISVC_NAME" --shadow "${ISVC_NAME}-shadow" \
            --window 30m --min-rank-corr 0.85 --min-tier-agreement 0.90 \
            --max-p99-ms "$MAX_P99_RESCORE_MS" --max-error-rate 0.001

      - name: Remove shadow on failure
        if: failure()
        run: bash serving/k8s/remove-shadow.sh

  # =========================================================================
  # 9. CD STAGE 1b: SHADOW SOAK ANALYSIS (7 days, system-design.md 6.4 step 7)
  #    The `shadow-soak` environment has a 10080-minute wait timer, so this job
  #    starts 7 days after deploy-shadow without holding a runner. It evaluates
  #    the whole soak once (--lookback = shadow age) and removes the shadow.
  # =========================================================================
  shadow-analysis:
    name: Shadow Soak Analysis (7 days)
    runs-on: [self-hosted, linux, churn-vnet]
    needs: [register-model, deploy-shadow]
    environment: shadow-soak # wait timer: 10080 minutes (configure in repo settings)
    env:
      MODEL_VERSION: ${{ needs.register-model.outputs.model_version }}
      ISTIO_INGRESS_GATEWAY: ${{ vars.ISTIO_INGRESS_GATEWAY }}
      CHURN_API_INGRESS_HOST: ${{ vars.CHURN_API_INGRESS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deploy dependencies
        run: pip install -r serving/requirements-deploy.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials -g "$AZURE_RESOURCE_GROUP" -n "$AKS_CLUSTER" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Verify soak (same model version, >= 7 days)
        id: soak
        run: |
          meta() {
            kubectl get isvc "${ISVC_NAME}-shadow" -n "$KSERVE_NAMESPACE" \
              -o jsonpath="{.metadata.annotations.churn\.ai/$1}"
          }
          version=$(meta model-version); started=$(meta shadow-started)
          if [ "$version" != "$MODEL_VERSION" ]; then
            echo "::error::Shadow is v${version:-none}, not v$MODEL_VERSION (superseded); not promoting"
            exit 1
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          if [ "$age" -lt $(( SHADOW_SOAK_DAYS * 86400 )) ]; then
            echo "::error::Shadow age ${age}s < ${SHADOW_SOAK_DAYS}d: is the shadow-soak wait timer configured?"
            exit 1
          fi
          echo "lookback=${age}s" >> "$GITHUB_OUTPUT"

      - name: Shadow soak analysis (whole soak window)
        run: |
          # Champion vs shadow on 7 days of mirrored traffic:
          # rank correlation >= 0.85, risk-tier agreement >= 90%,
          # p99 latency within SLO, 5xx rate < 0.1%
          python -m churn.deploy.shadow_analysis \
            --prometheus-url "${{ vars.AMW_PROMETHEUS_QUERY_URL }}" \
            --namespace "$KSERVE_NAMESPACE" \
            --champion "$ISVC_NAME" --shadow "${ISVC_NAME}-shadow" \
            --lookback "${{ steps.soak.outputs.lookback }}" \
            --min-rank-corr 0.85 --min-tier-agreement 0.90 \
            --max-p99-ms "$MAX_P99_RESCORE_MS" --max-error-rate 0.001

      - name: Remove shadow
        if: always()
        run: bash serving/k8s/remove-shadow.sh

  # =========================================================================
  # 10. CD STAGE 2: PROGRESSIVE CANARY 10% -> 50% -> 100% (prod approval)
  #    KServe keeps the last ready revision; canaryTrafficPercent=0 rolls back.
  #    Argo CD ignores spec.predictor.canaryTrafficPercent drift during rollout.
  # =========================================================================
  deploy-canary:
    name: Canary Rollout to Production
    runs-on: [self-hosted, linux, churn-vnet]
    needs: [register-model, shadow-analysis]
    environment: production # required reviewers: ML lead + Customer Success owner
    concurrency:
      group: churn-prod-rollout
      cancel-in-progress: false
    env:
      STORAGE_URI: ${{ needs.register-model.outputs.storage_uri }}
      MODEL_VERSION: ${{ needs.register-model.outputs.model_version }}
      PROM_URL: ${{ vars.AMW_PROMETHEUS_QUERY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials -g "$AZURE_RESOURCE_GROUP" -n "$AKS_CLUSTER" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          pip install -r serving/requirements-deploy.txt

      - name: Canary 10%
        run: |
          # JSON patch: a merge patch would replace the whole transformer containers
          # array (dropping env/probes). Predictor and transformer are both canaried
          # so the new image and the new model roll out together (env[0] = STORAGE_URI).
          kubectl patch isvc "$ISVC_NAME" -n "$KSERVE_NAMESPACE" --type json -p "[
            {\"op\": \"add\", \"path\": \"/metadata/annotations/churn.ai~1model-version\", \"value\": \"$MODEL_VERSION\"},
            {\"op\": \"add\", \"path\": \"/spec/predictor/canaryTrafficPercent\", \"value\": 10},
            {\"op\": \"replace\", \"path\": \"/spec/predictor/model/storageUri\", \"value\": \"$STORAGE_URI\"},
            {\"op\": \"add\", \"path\": \"/spec/transformer/canaryTrafficPercent\", \"value\": 10},
            {\"op\": \"replace\", \"path\": \"/spec/transformer/containers/0/image\", \"value\": \"$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG\"},
            {\"op\": \"replace\", \"path\": \"/spec/transformer/containers/0/env/0/value\", \"value\": \"$STORAGE_URI\"}
          ]"
          kubectl wait --for=condition=Ready "isvc/$ISVC_NAME" -n "$KSERVE_NAMESPACE" --timeout=600s

      - name: Analyse canary 10% (30 min)
        run: |
          python -m churn.deploy.canary_analysis --prometheus-url "$PROM_URL" \
            --namespace "$KSERVE_NAMESPACE" --isvc "$ISVC_NAME" --window 30m \
            --max-p99-ms "$MAX_P99_RESCORE_MS" --max-error-rate 0.001 --max-score-psi 0.1

      - name: Canary 50%
        run: |
          kubectl patch isvc "$ISVC_NAME" -n "$KSERVE_NAMESPACE" --type merge \
            -p '{"spec":{"predictor":{"canaryTrafficPercent":50},"transformer":{"canaryTrafficPercent":50}}}'
          kubectl wait --for=condition=Ready "isvc/$ISVC_NAME" -n "$KSERVE_NAMESPACE" --timeout=300s

      - name: Analyse canary 50% (60 min)
        run: |
          python -m churn.deploy.canary_analysis --prometheus-url "$PROM_URL" \
            --namespace "$KSERVE_NAMESPACE" --isvc "$ISVC_NAME" --window 60m \
            --max-p99-ms "$MAX_P99_RESCORE_MS" --max-error-rate 0.001 --max-score-psi 0.1

      - name: Promote to 100%
        run: |
          kubectl patch isvc "$ISVC_NAME" -n "$KSERVE_NAMESPACE" --type merge \
            -p '{"spec":{"predictor":{"canaryTrafficPercent":100},"transformer":{"canaryTrafficPercent":100}}}'
          kubectl wait --for=condition=Ready "isvc/$ISVC_NAME" -n "$KSERVE_NAMESPACE" --timeout=300s

      - name: Post-promotion smoke test via APIM
        env:
          CHURN_API_SCOPE: ${{ vars.CHURN_API_SCOPE }} # Entra app scope, e.g. api://churn-scoring/.default
        run: |
          # Service-side SLOs from the transformer's x-churn-server-time-ms header
          # (precomputed <= 50 ms, rescoring <= 150 ms); APIM end-to-end <= 300 ms.
          python -m churn.deploy.smoke_test --endpoint "${{ vars.CHURN_API_INTERNAL_URL }}" \
            --samples 200 --max-server-p99-ms "$MAX_P99_LATENCY_MS" \
            --max-server-rescore-p99-ms "$MAX_P99_RESCORE_MS" \
            --max-client-p99-ms "$MAX_P99_APIM_MS"

      - name: Promote MLflow aliases (challenger -> champion)
        run: |
          az extension add --name ml --upgrade --yes
          export MLFLOW_TRACKING_URI=$(az ml workspace show -n "$AML_WORKSPACE" \
            -g "$AZURE_RESOURCE_GROUP" --query mlflow_tracking_uri -o tsv)
          python - <<'PY'
          import os
          from mlflow import MlflowClient
          c = MlflowClient()
          name, ver = os.environ["MODEL_NAME"], os.environ["MODEL_VERSION"]
          try:
              prev = c.get_model_version_by_alias(name, "champion").version
              c.set_registered_model_alias(name, "previous-champion", prev)
          except Exception:
              pass
          c.set_registered_model_alias(name, "champion", ver)
          c.delete_registered_model_alias(name, "challenger")
          PY

      - name: Automatic rollback on failure
        if: failure()
        run: |
          echo "::error::Canary analysis failed - rolling back to last ready revision"
          kubectl patch isvc "$ISVC_NAME" -n "$KSERVE_NAMESPACE" --type merge \
            -p '{"spec":{"predictor":{"canaryTrafficPercent":0},"transformer":{"canaryTrafficPercent":0}}}'
          kubectl wait --for=condition=Ready "isvc/$ISVC_NAME" -n "$KSERVE_NAMESPACE" --timeout=300s
          kubectl annotate isvc "$ISVC_NAME" -n "$KSERVE_NAMESPACE" \
            churn.ai/rolled-back-version="$MODEL_VERSION" --overwrite

      - name: Notify Teams / PagerDuty
        if: always()
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -sS -H 'Content-Type: application/json' -X POST "$TEAMS_WEBHOOK" \
            -d "{\"text\": \"Churn model v$MODEL_VERSION rollout: $JOB_STATUS (run $GITHUB_RUN_ID)\"}"
